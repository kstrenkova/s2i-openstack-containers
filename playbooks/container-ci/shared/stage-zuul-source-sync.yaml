---
# Sync a single Zuul source checkout into its container build context.
#
# s2i_ci_src is a list:
#   [name, canonical_project, url, dest_dir, pinned_hash]
# from `build.sh list-sources` output.

- name: "Resolve Zuul checkout path for {{ s2i_ci_src[0] }}"
  ansible.builtin.set_fact:
    s2i_ci_sync_from: >-
      {{ s2i_ci_workspace_root }}/{{
         zuul.projects[s2i_ci_zuul_name_map[s2i_ci_src[1]]].src_dir }}
    s2i_ci_sync_to: "{{ s2i_ci_src[3] }}"

- name: "Verify Zuul checkout exists for {{ s2i_ci_src[0] }}"
  ansible.builtin.stat:
    path: "{{ s2i_ci_sync_from }}/.git"
  register: s2i_ci_sync_check

- name: "Sync into build context for {{ s2i_ci_src[0] }}"
  when: s2i_ci_sync_check.stat.isdir | default(false)
  block:
    - name: "Ensure destination directory for {{ s2i_ci_src[0] }}"
      ansible.builtin.file:
        path: "{{ s2i_ci_sync_to }}"
        state: directory
        mode: "0755"

    - name: "Copy source for {{ s2i_ci_src[0] }}"
      ansible.builtin.command:
        argv:
          - rsync
          - --archive
          - --delete
          - --exclude=.tox
          - --exclude=.venv
          - --exclude=__pycache__
          - "{{ s2i_ci_sync_from }}/"
          - "{{ s2i_ci_sync_to }}/"
      changed_when: true

    - name: "Log staged source for {{ s2i_ci_src[0] }}"
      ansible.builtin.debug:
        msg: "Staged {{ s2i_ci_src[1] }} -> {{ s2i_ci_sync_to }}"

    # Zuul stages branch tip. Reset to the sources.txt pin unless this
    # project carries a change in the buildset. The pin is an ancestor of
    # the tip, so the object is already in the Zuul checkout; if it is
    # not, drop the tree and let build.sh clone the pin as it always has.
    - name: "Check out the pinned commit for {{ s2i_ci_src[0] }}"
      when:
        - s2i_ci_prefer_shas | default(false) | bool
        - s2i_ci_zuul_name_map[s2i_ci_src[1]] not in
          s2i_ci_change_projects | default([])
        - s2i_ci_src[4] | default('') | length > 0
        - s2i_ci_src[4] != '-'
      block:
        - name: "Reset to pin {{ s2i_ci_src[0] ~ ' ' ~ s2i_ci_src[4] }}"
          ansible.builtin.command:
            argv:
              - git
              - checkout
              - --quiet
              - --detach
              - "{{ s2i_ci_src[4] }}"
            chdir: "{{ s2i_ci_sync_to }}"
          changed_when: true
      rescue:
        - name: "Discard the tree so build.sh clones {{ s2i_ci_src[0] }}"
          ansible.builtin.file:
            path: "{{ s2i_ci_sync_to }}"
            state: absent

        - name: "Warn about the clone fallback for {{ s2i_ci_src[0] }}"
          ansible.builtin.debug:
            msg: >-
              {{ s2i_ci_src[4] }} not present in the Zuul checkout of
              {{ s2i_ci_src[1] }}; build.sh will clone it instead.

    - name: "Record staged project for {{ s2i_ci_src[0] }}"
      ansible.builtin.set_fact:
        s2i_ci_staged_projects: >-
          {{ ((s2i_ci_staged_projects | default([]))
              + [s2i_ci_src[3] | dirname | dirname | basename])
             | unique | list }}
